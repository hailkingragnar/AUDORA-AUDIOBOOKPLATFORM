<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Audiobook Player')}">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>
<body class="bg-gray-900">

<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<!-- Dynamic Background Cover -->
<div id="cover-background" class="h-96 w-full relative bg-gradient-to-b from-blue-900 to-gray-900">
  <div class="container mx-auto max-w-6xl h-full relative z-10">
    <div class="flex flex-col md:flex-row gap-8 h-full items-start pt-20 pb-12 px-4">
      <!-- Book Cover (Square) with corrected positioning -->
      <div class="w-48 h-48 md:w-56 md:h-56 lg:w-64 lg:h-64 flex-shrink-0 shadow-2xl mt-8">
        <div class="relative group h-full">
          <img th:src="@{'/Images/Books/'+${book.image}}"
               alt="Book Cover"
               class="w-full h-full object-contain aspect-[3/4]"
               loading="lazy" decoding="async">
          <!-- Hover Play Button -->
          <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity duration-300">
            <button id="cover-play-button" class="w-16 h-16 bg-blue-600 bg-opacity-90 rounded-full flex items-center justify-center hover:bg-blue-700 transform transition-transform hover:scale-105">
              <i class="fas fa-play text-white text-2xl" id="cover-play-icon"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Book Info -->
      <div class="flex-1 text-white pb-8 mt-8">
        <h1 th:text="${book.title}" class="text-3xl md:text-4xl lg:text-5xl font-bold mb-2"></h1>
        <p class="text-lg md:text-xl text-gray-300 mb-6">By <span th:text="${book.author}">Author Name</span></p>

        <!-- Meta Info -->
        <div class="flex flex-wrap gap-4 mb-6">
          <div class="flex items-center">
            <i class="fas fa-clock mr-2 text-blue-300"></i>
            <span th:text="${book.duration}">8h 45m</span>
          </div>
          <div class="flex items-center">
            <i class="fas fa-language mr-2 text-blue-300"></i>
            <span th:text="${book.language}">English</span>
          </div>
          <div class="flex items-center">
            <i class="fas fa-eye mr-2 text-blue-300"></i>
            <span>1.2M views</span>
          </div>
          <div class="flex items-center">
            <i class="fas fa-star text-yellow-400 mr-2"></i>
            <span>4.5</span>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-4">
          <button id="main-play-button" class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-2 rounded-full font-medium flex items-center">
            <i class="fas fa-play mr-2"></i> Play Trailer
          </button>
          <button class="bg-gray-800 hover:bg-gray-700 text-white px-6 py-2 rounded-full font-medium flex items-center">
            <i class="far fa-bookmark mr-2"></i> Save
          </button>
          <button class="bg-gray-800 hover:bg-gray-700 text-white w-10 h-10 rounded-full flex items-center justify-center">
            <i class="fas fa-ellipsis-h"></i>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Main Content -->
<div class="container mx-auto max-w-6xl px-4 pb-32">
  <!-- Description Section (no card) -->
  <div class="mb-8 pt-8">
    <h2 class="text-xl font-bold text-white mb-4">About</h2>
    <p th:text="${book.description}" class="text-gray-300 leading-relaxed"></p>
  </div>

  <!-- Divider -->
  <div class="border-t border-gray-700 my-8"></div>

  <!-- Episodes List -->
  <div class="mb-12">
    <h2 class="text-2xl font-bold text-white mb-6">Episodes</h2>
    <div class="space-y-3">
      <div th:each="chapter : ${chapters}" class="bg-gray-800 hover:bg-gray-700 rounded-lg transition-all duration-200">
       <a th:href="@{'/book/viewchapter/' + ${chapter.id}}"> <div class="flex items-center p-4">
          <div class="w-10 h-10 flex-shrink-0 bg-gray-700 rounded-full flex items-center justify-center mr-4">
            <span class="text-gray-400" th:text="${chapterStat.count}">1</span>
          </div>
          <div class="flex-1 min-w-0">
            <h3 th:text="${chapter.title}" class="font-medium text-white truncate"></h3>
            <p class="text-sm text-gray-400" th:text="${chapter.duration}">45:30</p>
          </div>
          <button class="w-10 h-10 bg-white bg-opacity-10 hover:bg-opacity-20 rounded-full flex items-center justify-center ml-4">
            <i class="fas fa-play text-white"></i>
          </button>
        </div> </a>
      </div>
    </div>
  </div>

  <!-- Divider -->
  <div class="border-t border-gray-700 my-8"></div>

  <!-- More Like This -->
  <div class="mb-8">
    <h2 class="text-2xl font-bold text-white mb-6">More Like This</h2>
    <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
      <div class="bg-gray-800 hover:bg-gray-700 rounded-lg overflow-hidden transition-all duration-200">
        <img src="#"
             alt="Book Cover"
             class="w-full aspect-square object-cover">
        <div class="p-3">
          <h3 class="font-medium text-white text-sm mb-1">Book Title</h3>
          <p class="text-xs text-gray-400">Author Name</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Audio Player -->
<audio id="audio-element">
  <source src="https://audoranepaliaudios.s3.ap-south-1.amazonaws.com/audio1.mp3" type="audio/mpeg">
</audio>

<!-- Bottom Player (initially hidden) -->
<div class="bottom-player hidden" id="bottom-player">
  <div class="player-progress">
    <div id="progress-bar" class="player-progress-bar"></div>
  </div>
  <div class="flex items-center w-full px-4 py-2">
    <img id="player-book-cover" th:src="@{'/Images/Books/'+${book.image}}"
         alt="Book Cover"
         class="w-12 h-12 object-cover rounded mr-3">
    <div class="flex-1 min-w-0">
      <h3 id="player-book-title" th:text="${book.title}" class="font-medium text-gray-900 truncate"></h3>
      <p id="player-episode-title" class="text-xs text-gray-600 truncate">Chapter 1: The Silent Patient</p>
    </div>
    <div class="flex items-center space-x-4 mx-4">
      <button id="rewind-10" class="text-gray-700 hover:text-blue-600">
        <i class="fas fa-backward"></i> -10
      </button>
      <button id="play-pause" class="w-10 h-10 bg-blue-600 text-white rounded-full flex items-center justify-center hover:bg-blue-700">
        <i class="fas fa-pause"></i>
      </button>
      <button id="forward-10" class="text-gray-700 hover:text-blue-600">
        +10 <i class="fas fa-forward"></i>
      </button>
    </div>
    <div class="flex items-center space-x-2 mx-4">
      <span id="current-time" class="text-sm text-gray-700">0:00</span>
      <span class="text-sm text-gray-400">/</span>
      <span id="duration" class="text-sm text-gray-700">12:45</span>
    </div>
    <div class="flex items-center ml-4">
      <button id="volume-button" class="text-gray-700 mr-2">
        <i class="fas fa-volume-up"></i>
      </button>
      <input id="volume-control" type="range" min="0" max="1" step="0.1" value="1" class="w-20">
    </div>
  </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>


</body>
</html>
