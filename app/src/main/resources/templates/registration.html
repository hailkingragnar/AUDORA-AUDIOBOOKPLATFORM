<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - AUDORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
        }

        /* Glass effect matching home page */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Enhanced card for register form */
        .enhanced-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .enhanced-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Gradient text matching home page */
        .gradient-text {
            background: linear-gradient(45deg, #a855f7, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Button styling matching home page */
        .sparkle {
            position: relative;
            overflow: hidden;
        }

        .sparkle::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: sparkle 3s infinite;
        }

        @keyframes sparkle {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        /* Input styling */
        .input-enhanced {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-enhanced:focus {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .input-enhanced:hover {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Floating animation */
        .floating {
            animation: floating 6s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Reveal animation */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            animation: reveal 0.8s ease forwards;
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Icon bounce */
        .icon-bounce {
            animation: iconBounce 2s infinite;
        }

        @keyframes iconBounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }

        /* File input styling */
        .file-input {
            position: relative;
            overflow: hidden;
            display: inline-block;
            cursor: pointer;
            width: 100%;
        }

        .file-input input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 2px dashed rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-input-label:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }

        /* Profile picture preview animation */
        .profile-preview {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .profile-preview:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        /* Step indicator styling */
        .step-indicator {
            display: flex;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .step {
            width: 2rem;
            height: 2rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            margin: 0 0.5rem;
            position: relative;
            transition: all 0.3s ease;
        }

        .step.active {
            background: linear-gradient(45deg, #a855f7, #3b82f6);
            transform: scale(1.1);
        }

        .step.completed {
            background: linear-gradient(45deg, #10b981, #06b6d4);
        }

        .step::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 100%;
            width: 1rem;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
        }

        .step:last-child::after {
            display: none;
        }

        /* Form step transitions */
        .form-step {
            display: none;
            animation: fadeIn 0.5s ease forwards;
        }

        .form-step.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body class="min-h-screen relative overflow-x-hidden">


<!-- Background decorative elements -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-20 text-6xl opacity-10 floating">🎧</div>
    <div class="absolute top-32 right-32 text-4xl opacity-5 floating" style="animation-delay: 1s;">📚</div>
    <div class="absolute bottom-32 left-32 text-5xl opacity-10 floating" style="animation-delay: 2s;">✨</div>
    <div class="absolute bottom-20 right-20 text-3xl opacity-5 floating" style="animation-delay: 1.5s;">🎵</div>
    <div class="absolute top-1/2 left-5 text-4xl opacity-10 floating" style="animation-delay: 3s;">📖</div>
</div>

<div class="flex items-center justify-center min-h-screen w-full">
    <div class="enhanced-card rounded-2xl mt-12 w-full max-w-md px-6 shadow-2xl reveal mb-8 mx-4">
        <!-- Step Indicator -->
        <div class="step-indicator pt-6">
            <div class="step active" id="step1">1</div>
            <div class="step" id="step2">2</div>
            <div class="step" id="step3">3</div>
        </div>

        <!-- Logo and Title -->
        <div class="text-center mb-4">
            <h2 class="text-lg font-bold gradient-text mb-1 p-4 floating">Join AUDORA</h2>
            <p class="text-gray-400 text-sm font-light">Start your incredible audio journey today</p>
        </div>

        <form th:action="@{/register}" th:object="${user}" enctype="multipart/form-data" method="POST" class="space-y-5">
            <!-- Step 1: Basic Information -->
            <div class="form-step active" id="formStep1">
                <!-- Full Name Field -->
                <div>
                    <label class="block mb-1 text-sm font-semibold text-white flex items-center space-x-2">
                        <span>👤</span>
                        <span>Full Name</span>
                    </label>
                    <input
                            type="text"
                            th:field="*{name}"
                            placeholder="Your full name"
                            required
                            class="w-full px-4 py-3 rounded-xl input-enhanced focus:outline-none text-white placeholder-gray-400"
                    />
                </div>

                <!-- Email Field -->
                <div>
                    <label class="block mb-1 text-sm font-semibold text-white flex items-center space-x-2">
                        <span>📧</span>
                        <span>Email Address</span>
                    </label>
                    <input
                            type="email"
                            th:field="*{email}"
                            placeholder="you@example.com"
                            required
                            class="w-full px-4 py-3 rounded-xl input-enhanced focus:outline-none text-white placeholder-gray-400"
                    />
                </div>

                <div class="flex justify-end pt-4">
                    <button type="button" onclick="nextStep(1)" class="px-6 py-2 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-medium rounded-lg hover:from-purple-600 hover:to-blue-600 transition-all duration-300 transform hover:scale-105">
                        Next Step →
                    </button>
                </div>
            </div>

            <!-- Step 2: Password -->
            <div class="form-step" id="formStep2">
                <!-- Password Field -->
                <div>
                    <label class="block mb-1 text-sm font-semibold text-white flex items-center space-x-2">
                        <span>🔒</span>
                        <span>Create Password</span>
                    </label>
                    <input
                            type="password"
                            th:field="*{password}"
                            placeholder="Create a secure password"
                            required
                            id="password"
                            class="w-full px-4 py-3 rounded-xl input-enhanced focus:outline-none text-white placeholder-gray-400"
                    />
                </div>

                <!-- Confirm Password Field -->
                <div>
                    <label class="block mb-1 text-sm font-semibold text-white flex items-center space-x-2">
                        <span>🔐</span>
                        <span>Confirm Password</span>
                    </label>
                    <input
                            type="password"
                            placeholder="Confirm your password"
                            required
                            id="confirmPassword"
                            class="w-full px-4 py-3 rounded-xl input-enhanced focus:outline-none text-white placeholder-gray-400"
                    />
                    <p id="passwordError" class="text-red-400 text-xs mt-1 hidden">Passwords don't match!</p>
                </div>

                <div class="flex justify-between pt-4">
                    <button type="button" onclick="prevStep(2)" class="px-6 py-2 bg-gray-600 text-white font-medium rounded-lg hover:bg-gray-700 transition-all duration-300 transform hover:scale-105">
                        ← Previous
                    </button>
                    <button type="button" onclick="nextStep(2)" class="px-6 py-2 bg-gradient-to-r from-purple-500 to-blue-500 text-white font-medium rounded-lg hover:from-purple-600 hover:to-blue-600 transition-all duration-300 transform hover:scale-105">
                        Next Step →
                    </button>
                </div>
            </div>

            <!-- Step 3: Profile Picture -->
            <div class="form-step" id="formStep3">
                <!-- Profile Picture Field with Live Preview -->
                <div>
                    <label class="block mb-1 text-sm font-semibold text-white flex items-center space-x-2">
                        <span>📷</span>
                        <span>Profile Picture (Optional)</span>
                    </label>

                    <div class="file-input">
                        <input
                                type="file"
                                th:field="*{profilePicture}"
                                accept="image/*"
                                id="profilePicInput"
                                onchange="previewImage(event)"
                        />
                        <label for="profilePicInput" class="file-input-label text-gray-300">
                            <span class="mr-2">📁</span>
                            <span>Choose your profile picture</span>
                        </label>
                    </div>

                    <!-- Live Image Preview -->
                    <div class="mt-4 flex justify-center" id="imagePreviewContainer">
                        <div class="relative">
                            <img id="profilePicPreview" src="" alt="Profile Picture Preview"
                                 class="w-24 h-24 object-cover rounded-full hidden profile-preview border-2 border-white/20" />
                            <button type="button" id="removeImageButton"
                                    class="absolute -top-1 -right-1 bg-red-500 text-white rounded-full w-6 h-6 flex items-center justify-center text-xs font-bold hover:bg-red-600 transition-colors duration-300 hidden transform hover:scale-110"
                                    onclick="removeImage()">
                                ✕
                            </button>
                        </div>
                    </div>
                </div>

                <div class="flex justify-between pt-8">
                    <button type="button" onclick="prevStep(3)" class="px-6 py-2 bg-gray-600 text-white font-medium rounded-lg hover:bg-gray-700 transition-all duration-300 transform hover:scale-105">
                        ← Previous
                    </button>
                    <button
                            type="submit"
                            class="px-6 py-2 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold rounded-lg hover:from-green-600 hover:to-emerald-700 transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl sparkle"
                    >
                        <span class="flex items-center justify-center space-x-2">
                            <span>🌟</span>
                            <span>Complete Registration</span>
                        </span>
                    </button>
                </div>
            </div>
        </form>

        <!-- Login Link -->
        <p class="text-center text-sm text-gray-400 mt-6 pb-6">
            Already part of our community?
            <a href="/login" class="text-yellow-400 hover:text-yellow-300 transition-colors duration-300 font-semibold hover:underline ml-1">
                🎧 Sign In Here
            </a>
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:inline="javascript">
    /*<![CDATA[*/
    let success = [[${success != null}]];
    let error = [[${error != null}]];

    if (success) {
        Swal.fire({
            icon: 'success',
            title: 'Welcome to AUDORA!',
            text: [[${success}]],
            timer: 3000,
            showConfirmButton: false,
            background: 'rgba(0, 0, 0, 0.9)',
            backdrop: 'rgba(0, 0, 0, 0.4)',
            color: '#fff',
            customClass: {
                popup: 'backdrop-blur-lg border border-white/10'
            }
        });
    }

    if (error) {
        Swal.fire({
            icon: 'error',
            title: 'Registration Error',
            text: [[${error}]],
            timer: 3000,
            showConfirmButton: false,
            background: 'rgba(0, 0, 0, 0.9)',
            backdrop: 'rgba(0, 0, 0, 0.4)',
            color: '#fff',
            customClass: {
                popup: 'backdrop-blur-lg border border-white/10'
            }
        });
    }
    /*]]>*/

    // Form step navigation
    function nextStep(currentStep) {
        console.log(`Attempting to go to next step from step ${currentStep}`);

        // Validate current step before proceeding
        if (currentStep === 1) {
            const name = document.querySelector('input[name="name"]').value;
            const email = document.querySelector('input[name="email"]').value;

            if (!name || !email) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Missing Information',
                    text: 'Please fill in all fields before proceeding',
                    background: 'rgba(0, 0, 0, 0.9)',
                    color: '#fff'
                });
                return;
            }
        } else if (currentStep === 2) {
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                document.getElementById('passwordError').classList.remove('hidden');
                return;
            }
        }

        // Hide current step
        const currentFormStep = document.getElementById(`formStep${currentStep}`);
        const currentStepIndicator = document.getElementById(`step${currentStep}`);

        if (currentFormStep) currentFormStep.classList.remove('active');
        if (currentStepIndicator) {
            currentStepIndicator.classList.remove('active');
            currentStepIndicator.classList.add('completed');
        }

        // Show next step
        const nextStepNum = currentStep + 1;
        const nextFormStep = document.getElementById(`formStep${nextStepNum}`);
        const nextStepIndicator = document.getElementById(`step${nextStepNum}`);

        if (nextFormStep) nextFormStep.classList.add('active');
        if (nextStepIndicator) nextStepIndicator.classList.add('active');

        console.log(`Successfully moved to step ${nextStepNum}`);
    }

    function prevStep(currentStep) {
        console.log(`Going back to previous step from step ${currentStep}`);

        // Hide current step
        const currentFormStep = document.getElementById(`formStep${currentStep}`);
        const currentStepIndicator = document.getElementById(`step${currentStep}`);

        if (currentFormStep) currentFormStep.classList.remove('active');
        if (currentStepIndicator) currentStepIndicator.classList.remove('active');

        // Show previous step
        const prevStepNum = currentStep - 1;
        const prevFormStep = document.getElementById(`formStep${prevStepNum}`);
        const prevStepIndicator = document.getElementById(`step${prevStepNum}`);

        if (prevFormStep) prevFormStep.classList.add('active');
        if (prevStepIndicator) {
            prevStepIndicator.classList.add('active');
            prevStepIndicator.classList.remove('completed');
        }

        console.log(`Successfully moved back to step ${prevStepNum}`);
    }

    // Password match validation
    document.getElementById('confirmPassword')?.addEventListener('input', function() {
        const password = document.getElementById('password').value;
        const confirmPassword = this.value;
        const errorElement = document.getElementById('passwordError');

        if (password !== confirmPassword) {
            errorElement?.classList.remove('hidden');
        } else {
            errorElement?.classList.add('hidden');
        }
    });

    // Live image preview function
    function previewImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function() {
            const preview = document.getElementById('profilePicPreview');
            const removeButton = document.getElementById('removeImageButton');
            const label = document.querySelector('.file-input-label span:last-child');

            if (preview) {
                preview.src = reader.result;
                preview.classList.remove('hidden');
            }
            if (removeButton) removeButton.classList.remove('hidden');
            if (label) label.textContent = 'Picture selected! ✅';
        };
        reader.readAsDataURL(file);
    }

    // Function to remove the uploaded image
    function removeImage() {
        const preview = document.getElementById('profilePicPreview');
        const inputFile = document.getElementById('profilePicInput');
        const removeButton = document.getElementById('removeImageButton');
        const label = document.querySelector('.file-input-label span:last-child');

        if (inputFile) inputFile.value = '';
        if (preview) preview.classList.add('hidden');
        if (removeButton) removeButton.classList.add('hidden');
        if (label) label.textContent = 'Choose your profile picture';
    }

    // Initialize form steps
    document.addEventListener('DOMContentLoaded', function() {
        console.log('Registration form initialized');
        // Ensure only the first step is visible initially
        document.getElementById('formStep1')?.classList.add('active');
        document.getElementById('step1')?.classList.add('active');
    });
</script>

</body>
</html>
