<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - AUDORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Animated gradient background */
        .animated-bg {
            background: linear-gradient(-45deg, #667eea, #764ba2, #f093fb, #f5576c);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Enhanced glassmorphism */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.1);
        }

        /* Floating elements animation */
        .floating {
            animation: floating 6s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(5deg); }
            66% { transform: translateY(-10px) rotate(-3deg); }
        }

        /* Gradient text */
        .gradient-text {
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 300% 300%;
            animation: gradientShift 8s ease infinite;
        }

        /* Input focus glow */
        .input-glow:focus {
            box-shadow: 0 0 20px rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.6);
        }

        /* Button pulse animation */
        .pulse-btn {
            position: relative;
            overflow: hidden;
        }

        .pulse-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: width 0.6s, height 0.6s;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        .pulse-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .pulse-btn > span {
            position: relative;
            z-index: 1;
        }

        /* Sparkle animation */
        .sparkle {
            position: relative;
            overflow: hidden;
        }

        .sparkle::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: sparkle 3s infinite;
        }

        @keyframes sparkle {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        /* Reveal animation */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            animation: reveal 0.8s ease forwards;
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Stagger animation delays */
        .reveal:nth-child(1) { animation-delay: 0.1s; }
        .reveal:nth-child(2) { animation-delay: 0.2s; }
        .reveal:nth-child(3) { animation-delay: 0.3s; }
        .reveal:nth-child(4) { animation-delay: 0.4s; }
        .reveal:nth-child(5) { animation-delay: 0.5s; }

        /* Hover lift effect */
        .hover-lift {
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hover-lift:hover {
            transform: translateY(-5px) scale(1.02);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.15);
        }

        /* Icon animations */
        .icon-pulse {
            animation: iconPulse 2s infinite;
        }

        @keyframes iconPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        /* Input container hover effect */
        .input-container {
            position: relative;
            transition: all 0.3s ease;
        }

        .input-container:hover {
            transform: translateY(-2px);
        }

        .input-container::before {
            content: '';
            position: absolute;
            inset: -2px;
            padding: 2px;
            background: linear-gradient(45deg, #667eea, #764ba2, #f093fb, #f5576c);
            border-radius: 14px;
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .input-container:hover::before {
            opacity: 0.3;
        }

        /* Profile picture preview animation */
        .profile-preview {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .profile-preview:hover {
            transform: scale(1.05);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        /* File input styling */
        .file-input {
            position: relative;
            overflow: hidden;
            display: inline-block;
            cursor: pointer;
            width: 100%;
        }

        .file-input input[type="file"] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px dashed rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .file-input-label:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="animated-bg min-h-screen px-4 py-8 relative overflow-x-hidden flex items-center justify-center">

<!-- Decorative floating elements -->
<div class="absolute top-10 left-10 text-6xl opacity-20 floating">🎧</div>
<div class="absolute top-20 right-20 text-4xl opacity-15 floating" style="animation-delay: 1s;">📚</div>
<div class="absolute bottom-20 left-20 text-5xl opacity-10 floating" style="animation-delay: 2s;">✨</div>
<div class="absolute bottom-32 right-32 text-3xl opacity-20 floating" style="animation-delay: 1.5s;">🎵</div>
<div class="absolute top-1/2 left-5 text-4xl opacity-10 floating" style="animation-delay: 3s;">📖</div>
<div class="absolute top-1/4 right-10 text-5xl opacity-15 floating" style="animation-delay: 2.5s;">🌟</div>

<div class="glass-card p-8 md:p-10 rounded-3xl w-full max-w-lg text-white hover-lift sparkle reveal my-8">
    <!-- Logo and Title -->
    <div class="text-center mb-8">
        <div class="text-4xl mb-4 icon-pulse">🚀</div>
        <h2 class="text-4xl font-black gradient-text mb-2">Join AUDORA</h2>
        <p class="text-purple-200 text-sm font-light">Start your incredible audio journey today</p>
    </div>

    <form th:action="@{/register}" th:object="${user}" enctype="multipart/form-data" method="POST" class="space-y-6">
        <!-- Full Name Field -->
        <div class="input-container reveal">
            <label class="block mb-2 text-sm font-semibold text-purple-200 flex items-center space-x-2">
                <span>👤</span>
                <span>Full Name</span>
            </label>
            <input
                    type="text"
                    th:field="*{name}"
                    placeholder="Your full name"
                    required
                    class="w-full px-5 py-4 rounded-xl bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition-all duration-300 text-white placeholder-purple-200 input-glow backdrop-blur-sm"
            />
        </div>

        <!-- Email Field -->
        <div class="input-container reveal">
            <label class="block mb-2 text-sm font-semibold text-purple-200 flex items-center space-x-2">
                <span>📧</span>
                <span>Email Address</span>
            </label>
            <input
                    type="email"
                    th:field="*{email}"
                    placeholder="you@example.com"
                    required
                    class="w-full px-5 py-4 rounded-xl bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition-all duration-300 text-white placeholder-purple-200 input-glow backdrop-blur-sm"
            />
        </div>

        <!-- Password Field -->
        <div class="input-container reveal">
            <label class="block mb-2 text-sm font-semibold text-purple-200 flex items-center space-x-2">
                <span>🔒</span>
                <span>Create Password</span>
            </label>
            <input
                    type="password"
                    th:field="*{password}"
                    placeholder="Create a secure password"
                    required
                    class="w-full px-5 py-4 rounded-xl bg-white/10 border border-white/20 focus:outline-none focus:ring-2 focus:ring-purple-400 focus:border-transparent transition-all duration-300 text-white placeholder-purple-200 input-glow backdrop-blur-sm"
            />
        </div>

        <!-- Profile Picture Field with Live Preview -->
        <div class="input-container reveal">
            <label class="block mb-2 text-sm font-semibold text-purple-200 flex items-center space-x-2">
                <span>📷</span>
                <span>Profile Picture (Optional)</span>
            </label>

            <div class="file-input">
                <input
                        type="file"
                        th:field="*{profilePicture}"
                        accept="image/*"
                        id="profilePicInput"
                        onchange="previewImage(event)"
                />
                <label for="profilePicInput" class="file-input-label text-purple-200">
                    <span class="mr-2">📁</span>
                    <span>Choose your profile picture</span>
                </label>
            </div>

            <!-- Live Image Preview -->
            <div class="mt-6 flex justify-center" id="imagePreviewContainer">
                <div class="relative">
                    <img id="profilePicPreview" src="" alt="Profile Picture Preview"
                         class="w-32 h-32 object-cover rounded-full hidden profile-preview border-4 border-white/20" />
                    <button type="button" id="removeImageButton"
                            class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-8 h-8 flex items-center justify-center text-sm font-bold hover:bg-red-600 transition-colors duration-300 hidden transform hover:scale-110"
                            onclick="removeImage()">
                        ✕
                    </button>
                </div>
            </div>
        </div>

        <button
                type="submit"
                class="w-full py-4 bg-gradient-to-r from-green-500 to-emerald-600 text-white font-bold rounded-xl hover:from-green-600 hover:to-emerald-700 transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl pulse-btn reveal"
        >
                <span class="flex items-center justify-center space-x-2">
                    <span>🌟</span>
                    <span>Create My Account</span>
                </span>
        </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center my-8">
        <div class="flex-1 h-px bg-gradient-to-r from-transparent via-white/30 to-transparent"></div>
        <span class="px-4 text-sm text-purple-200">or</span>
        <div class="flex-1 h-px bg-gradient-to-r from-transparent via-white/30 to-transparent"></div>
    </div>

    <!-- Login Link -->
    <p class="text-center text-sm text-purple-200">
        Already part of our community?
        <a href="/login" class="text-yellow-300 hover:text-yellow-200 transition-colors duration-300 font-semibold hover:underline ml-2">
            🎧 Sign In Here
        </a>
    </p>

    <!-- Footer -->
    <div class="text-center mt-8 pt-6 border-t border-white/20">
        <p class="text-xs text-purple-300 opacity-75">
            Join thousands of audiobook enthusiasts ✨
        </p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    let success = [[${success != null}]];
    let error = [[${error != null}]];

    if (success) {
        Swal.fire({
            icon: 'success',
            title: 'Welcome to AUDORA!',
            text: [[${success}]],
            timer: 3000,
            showConfirmButton: false,
            background: 'rgba(255, 255, 255, 0.1)',
            backdrop: 'rgba(0, 0, 0, 0.4)',
            color: '#fff',
            customClass: {
                popup: 'backdrop-blur-lg'
            }
        });
    }

    if (error) {
        Swal.fire({
            icon: 'error',
            title: 'Registration Error',
            text: [[${error}]],
            timer: 3000,
            showConfirmButton: false,
            background: 'rgba(255, 255, 255, 0.1)',
            backdrop: 'rgba(0, 0, 0, 0.4)',
            color: '#fff',
            customClass: {
                popup: 'backdrop-blur-lg'
            }
        });
    }
    /*]]>*/

    // Live image preview function
    function previewImage(event) {
        const file = event.target.files[0];
        const reader = new FileReader();

        reader.onload = function () {
            const preview = document.getElementById('profilePicPreview');
            const removeButton = document.getElementById('removeImageButton');
            const label = document.querySelector('.file-input-label span:last-child');

            preview.src = reader.result;
            preview.classList.remove('hidden');  // Show the image preview
            removeButton.classList.remove('hidden'); // Show the remove button
            label.textContent = 'Picture selected! ✅'; // Update label text
        };

        if (file) {
            reader.readAsDataURL(file);
        }
    }

    // Function to remove the uploaded image
    function removeImage() {
        const preview = document.getElementById('profilePicPreview');
        const inputFile = document.getElementById('profilePicInput');
        const removeButton = document.getElementById('removeImageButton');
        const label = document.querySelector('.file-input-label span:last-child');

        // Clear the file input
        inputFile.value = '';

        // Hide the preview and remove button
        preview.classList.add('hidden');
        removeButton.classList.add('hidden');
        label.textContent = 'Choose your profile picture'; // Reset label text
    }
</script>

</body>
</html>
