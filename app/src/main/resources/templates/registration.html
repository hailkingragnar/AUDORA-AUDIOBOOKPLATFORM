<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - AUDORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
          font-family: 'Inter', sans-serif;
          background: linear-gradient(to right, #667eea, #764ba2); /* updated gradient */
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4 py-8">
<div class="bg-white/30 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md text-gray-800">
    <h2 class="text-2xl font-bold text-center mb-6">Register for AudioBook</h2>

    <form th:action="@{/register}" th:object="${user}" enctype="multipart/form-data" method="POST" class="space-y-5">
        <!-- Full Name Field -->
        <div>
            <label class="block mb-1 text-sm font-semibold">Full Name</label>
            <input
                    type="text"
                    th:field="*{name}"
                    placeholder="Your full name"
                    required
                    class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200"
            />
        </div>

        <!-- Email Field -->
        <div>
            <label class="block mb-1 text-sm font-semibold">Email</label>
            <input
                    type="email"
                    th:field="*{email}"
                    placeholder="you@example.com"
                    required
                    class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200"
            />
        </div>

        <!-- Password Field -->
        <div>
            <label class="block mb-1 text-sm font-semibold">Password</label>
            <input
                    type="password"
                    th:field="*{password}"
                    placeholder="Create a password"
                    required
                    class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200"
            />
        </div>

        <!-- Profile Picture Field with Live Preview -->
        <div>
            <label class="block mb-1 text-sm font-semibold">Profile Picture (Optional)</label>
            <input
                    type="file"
                    th:field="*{profilePicture}"
                    accept="image/*"
                    id="profilePicInput"
                    class="w-full px-3 py-2 rounded-lg border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200"
                    onchange="previewImage(event)"
            />
            <!-- Live Image Preview -->
            <div class="mt-4" id="imagePreviewContainer">
                <img id="profilePicPreview" src="" alt="Profile Picture Preview" class="w-32 h-32 object-cover rounded-full hidden" />
                <button type="button" id="removeImageButton" class="mt-2 text-red-500 font-semibold text-sm hidden" onclick="removeImage()">Remove Image</button>
            </div>
        </div>

        <button
                type="submit"
                class="w-full py-3 bg-green-600 text-white font-semibold rounded-xl hover:bg-green-700 transition duration-200"
        >
            Create Account
        </button>
    </form>

    <p class="text-center text-sm mt-6 text-white">
        Already have an account?
        <a href="/login" class="text-green-100 hover:underline">Login</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    let success = [[${success != null}]];
    let error = [[${error != null}]];

    if (success) {
        Swal.fire({
            icon: 'success',
            title: 'Success',
            text: [[${success}]],
            timer: 3000,
            showConfirmButton: false
        });
    }

    if (error) {
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: [[${error}]],
            timer: 3000,
            showConfirmButton: false
        });
    }
    /*]]>*/

    // Live image preview function
    function previewImage(event) {
        const file = event.target.files[0];
        const reader = new FileReader();

        reader.onload = function () {
            const preview = document.getElementById('profilePicPreview');
            const removeButton = document.getElementById('removeImageButton');
            preview.src = reader.result;
            preview.classList.remove('hidden');  // Show the image preview
            removeButton.classList.remove('hidden'); // Show the remove button
        };

        if (file) {
            reader.readAsDataURL(file);
        }
    }

    // Function to remove the uploaded image
    function removeImage() {
        const preview = document.getElementById('profilePicPreview');
        const inputFile = document.getElementById('profilePicInput');
        const removeButton = document.getElementById('removeImageButton');

        // Clear the file input
        inputFile.value = '';

        // Hide the preview and remove button
        preview.classList.add('hidden');
        removeButton.classList.add('hidden');
    }
</script>

</body>
</html>
