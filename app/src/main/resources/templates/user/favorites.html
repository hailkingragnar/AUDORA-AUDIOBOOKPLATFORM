<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('My Library')}"></head>
<body class="bg-gray-900 text-white">

<!-- Navbar -->
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<!-- Header Section -->
<section class="pt-32 pb-8 bg-gradient-to-b from-blue-900/30 to-gray-900/10">
    <div class="container mx-auto px-6 text-center">
        <h1 class="text-4xl md:text-5xl font-bold mb-4">MY LIBRARY</h1>
        <p class="text-gray-300 max-w-2xl mx-auto">All your saved books in one place</p>
    </div>
</section>

<!-- Books Section -->
<section class="py-8">
    <div class="container mx-auto px-4">

        <!-- Books Grid -->
        <div th:if="${!#lists.isEmpty(books)}" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6 gap-6">
            <div th:each="book : ${books}" class="transform transition-transform duration-300 hover:scale-105">
                <a th:href="@{'/user/viewbook/' + ${book.books.audiobookId}}" class="block">
                    <div class="relative overflow-hidden rounded-lg shadow-lg">
                        <img th:src="@{'/Images/Books/' + ${book.books.image}}"
                             alt="Book Cover"
                             class="w-full h-60 object-cover">
                        <div class="absolute inset-0 bg-gradient-to-t from-black/70 to-transparent flex items-end p-4">
                            <div>
                                <h3 class="text-white font-semibold text-sm md:text-base" th:text="${book.books.title}"></h3>
                                <p class="text-gray-300 text-xs" th:text="${book.books.author}"></p>
                            </div>
                        </div>
                    </div>
                </a>
            </div>
        </div>

        <!-- Empty State -->
        <div th:if="${#lists.isEmpty(books)}" class="text-center py-12">
            <div class="max-w-md mx-auto">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 mx-auto text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                </svg>
                <h3 class="mt-4 text-lg font-medium text-gray-300">No books found in your library</h3>
                <p class="mt-1 text-sm text-gray-500">We'll be adding more books soon!</p>
                <div class="mt-6">
                    <a href="/user/home" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-blue-600 hover:bg-blue-700">
                        Browse other categories
                    </a>
                </div>
            </div>
        </div>

    </div>
</section>

<!-- Footer -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
