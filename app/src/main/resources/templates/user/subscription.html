<!DOCTYPE html>
<html lang="en" class="dark" xmlns:th="http://www.w3.org/1999/xhtml">
<head th:replace="~{fragments/head :: head('Home')}"></head>

<body class="bg-darker text-gray-200 min-h-screen flex flex-col">
<!-- NAVBAR -->

<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>


<!-- Main Content -->
<main class="flex-grow container mx-auto px-4 py-32">
    <div class="text-center mb-16">
        <h1 class="text-4xl font-bold mb-4">Choose Your Plan</h1>
        <p class="text-gray-400 max-w-2xl mx-auto">Select the perfect plan for your needs. Upgrade, downgrade, or cancel anytime.</p>
    </div>

    <div class="grid md:grid-cols-3 gap-8 max-w-6xl mx-auto">
        <div th:each="plan : ${plans}"
             th:class="'bg-dark rounded-xl overflow-hidden flex flex-col transition-all relative hover:scale-[1.02] ' +
               ((plan.name == 'PREMIUM' or plan.name == 'FAMILY') ? 'border-2 border-yellow-400' : 'border border-gray-800 hover:border-primary/50')">

            <!-- Featured Badge -->
            <div th:if="${plan.featured}"
                 class="absolute top-0 right-0 bg-primary text-white text-xs font-bold px-3 py-1 rounded-bl-lg">
                POPULAR
            </div>

            <div class="p-8 flex flex-col flex-grow">
                <!-- Icon & Name -->
                <div class="flex items-center mb-6">
                    <div th:class="'p-3 rounded-lg mr-4 ' + (${plan.featured} ? 'bg-primary/10' : 'bg-gray-800/50')">
                        <i th:class="${plan.icon} + ' text-primary text-xl'"></i>
                    </div>
                    <h3 class="text-xl font-bold" th:text="${plan.name}"></h3>
                </div>

                <!-- Price -->
                <div class="mb-8">
                    <span class="text-4xl font-bold" th:text="'Rs.' + ${plan.price}"></span>
                    <span class="text-gray-400" th:text="${plan.duration}"></span>
                </div>

                <!-- Features -->
                <ul class="space-y-3 mb-8">
                    <li th:each="feature,iterStat : ${plan.features}"
                        th:class="${iterStat.index == plan.features.size() - 1 && plan.name=='Free'} ? 'flex items-center text-gray-500' : 'flex items-center'">
                        <i th:class="${iterStat.index == plan.features.size() - 1 && plan.name=='Free'} ?
                             'fas fa-times text-red-500 mr-2' :
                             'fas fa-check text-green-500 mr-2'"></i>
                        <span th:text="${feature}"></span>
                    </li>
                </ul>

                <div class="flex-grow"></div>

                <!-- Buttons -->
                <button th:if="${plan.currentPlan}"
                        class="w-full py-3 bg-gray-800 hover:bg-gray-700 rounded-md transition mt-4">
                    Current Plan
                </button>

                <button th:if="${!plan.currentPlan}"
                        th:text="'Choose ' + ${plan.name}"
                        th:class="(plan.name == 'PREMIUM' or plan.name == 'FAMILY') ?
                          'w-full py-3 bg-gray-800 hover:bg-yellow-400 hover:shadow-lg hover:shadow-yellow-500/50 text-white rounded-md transition mt-4' :
                          'w-full py-3 bg-gray-800 hover:bg-gray-600 text-white rounded-md transition mt-4'">
                </button>
            </div>
        </div>


    </div>
</main>


<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
