<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Profile')}"></head>
<body>

<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<!-- Main container -->
<div class="flex min-h-screen pt-16">
    <!-- Sidebar -->
    <div class="w-80 glass-sidebar text-white flex flex-col py-8 px-8 shadow-2xl reveal">
        <div class="flex items-center space-x-4 mb-12 p-6 glass-card rounded-2xl sparkle">
            <img th:src="@{'/Images/profilepicture/'+ ${users.profilePicture}}" alt="Profile Picture"
                 class="w-20 h-20 rounded-full object-cover profile-glow">
            <div class="space-y-2">
                <h2 class="text-xl font-light text-purple-200">Welcome,</h2>
                <h3 th:text="${users.name}" class="text-2xl font-bold gradient-text"></h3>
            </div>
        </div>

        <nav class="flex flex-col space-y-6">
            <a href="/user/profile" class="nav-link text-white hover:text-yellow-300 transition duration-300 flex items-center space-x-3 text-lg font-medium">
                <span class="text-2xl">👤</span>
                <span>Profile</span>
            </a>
            <a href="/user/subscription" class="nav-link text-white hover:text-yellow-300 transition duration-300 flex items-center space-x-3 text-lg font-medium">
                <span class="text-2xl">⭐</span>
                <span>Subscription</span>
            </a>
            <a href="/user/about" class="nav-link text-white hover:text-yellow-300 transition duration-300 flex items-center space-x-3 text-lg font-medium">
                <span class="text-2xl">ℹ️</span>
                <span>About</span>
            </a>
        </nav>
    </div>

    <!-- Profile Content -->
    <div class="flex-1 glass-content p-8 overflow-auto">
        <div class="max-w-4xl mx-auto">
            <h1 class="text-4xl font-bold text-white mb-8 reveal flex items-center space-x-3">
                <span class="text-5xl">👤</span>
                <span>Your Profile</span>
            </h1>

            <!-- Profile Details Section -->
            <div class="glass-card p-8 rounded-3xl shadow-2xl card-hover sparkle reveal">
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 mb-8">
                    <div class="lg:col-span-2 flex items-center space-x-6">
                        <img th:src="@{'/Images/profilepicture/'+ ${users.profilePicture}}" alt="Profile Picture"
                             class="w-32 h-32 rounded-full object-cover profile-glow">
                        <div class="space-y-2">
                            <h2 th:text="${users.name}" class="text-3xl font-bold text-white"></h2>
                            <p th:text="${users.email}" class="text-lg text-purple-200"></p>
                            <div class="flex items-center space-x-2 text-green-400">
                                <span class="w-3 h-3 bg-green-400 rounded-full"></span>
                                <span class="text-sm font-medium">Active Member</span>
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-end items-center">
                        <a href="/user/edit-profile"
                           class="pulse-btn bg-gradient-to-r from-yellow-400 to-orange-500 text-purple-900 px-8 py-4 rounded-full font-bold text-lg hover:from-yellow-500 hover:to-orange-600 transition-all duration-300 transform hover:scale-105 shadow-lg">
                  <span class="flex items-center space-x-2">
                    <span>✏️</span>
                    <span>Edit Profile</span>
                  </span>
                        </a>
                    </div>
                </div>

                <!-- Information Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div class="info-card p-6 rounded-2xl reveal">
                        <div class="flex items-center space-x-3 mb-3">
                            <span class="text-2xl">📧</span>
                            <h3 class="text-xl font-bold text-white">Email Address</h3>
                        </div>
                        <p th:text="${users.email}" class="text-lg text-purple-200"></p>
                    </div>

                    <div class="info-card p-6 rounded-2xl reveal">
                        <div class="flex items-center space-x-3 mb-3">
                            <span class="text-2xl">📱</span>
                            <h3 class="text-xl font-bold text-white">Phone Number</h3>
                        </div>
                        <p class="text-lg text-purple-200">09876556783</p>
                    </div>

                    <div class="info-card p-6 rounded-2xl reveal">
                        <div class="flex items-center space-x-3 mb-3">
                            <span class="text-2xl">💎</span>
                            <h3 class="text-xl font-bold text-white">Subscription Plan</h3>
                        </div>
                        <div class="flex items-center space-x-2">
                            <span class="bg-gradient-to-r from-blue-500 to-purple-600 text-white px-4 py-2 rounded-full text-sm font-bold">Basic</span>
                            <span class="text-purple-200">Plan</span>
                        </div>
                    </div>

                    <div class="info-card p-6 rounded-2xl reveal">
                        <div class="flex items-center space-x-3 mb-3">
                            <span class="text-2xl">📅</span>
                            <h3 class="text-xl font-bold text-white">Membership</h3>
                        </div>
                        <div class="space-y-1">
                            <p class="text-purple-200"><span class="text-green-400 font-semibold">Started:</span> 2025/12/23</p>
                            <p class="text-purple-200"><span class="text-orange-400 font-semibold">Expires:</span> 2027/12/13</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
