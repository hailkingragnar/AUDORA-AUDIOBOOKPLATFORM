<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${author.name + ' - Author'})}"></head>

<body class="bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 text-white">

<!-- Navbar -->
<th:block th:replace="~{fragments/navbar :: navbar}"></th:block>

<!-- Main Layout -->
<div class="flex min-h-screen pt-16">

    <!-- Content Area -->
    <div class="flex-1 p-8 overflow-auto">

        <!-- Author Header -->
        <div class="max-w-6xl mx-auto bg-white/5 backdrop-blur-lg border border-white/10 rounded-2xl shadow-2xl p-10 mb-12">
            <div class="flex flex-col md:flex-row items-center gap-10">

                <!-- Author Image -->
                <div class="relative">
                    <img th:src="@{'/Images/Authors/' + ${author.image}}"
                         class="w-44 h-44 rounded-full object-cover border-4 border-purple-400/50 shadow-xl">
                    <div class="absolute bottom-2 right-2 w-5 h-5 bg-green-500 rounded-full border-2 border-white"></div>
                </div>

                <!-- Author Info -->
                <div class="flex-1 text-center md:text-left space-y-4">
                    <h1 th:text="${author.name}"
                        class="text-4xl font-bold bg-gradient-to-r from-purple-400 to-blue-400 bg-clip-text text-transparent"></h1>

                    <div class="flex flex-wrap justify-center md:justify-start gap-4 text-sm">

                        <div class="flex items-center bg-white/10 px-4 py-2 rounded-full">
                            📚 <span class="ml-2" th:text="${author.booksList.size() + ' Books'}"></span>
                        </div>

                        <div th:if="${author.penName}" class="flex items-center bg-white/10 px-4 py-2 rounded-full">
                            ✍ <span class="ml-2" th:text="${author.penName}"></span>
                        </div>

                        <div th:if="${author.email}" class="flex items-center bg-white/10 px-4 py-2 rounded-full">
                            📧 <span class="ml-2" th:text="${author.email}"></span>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <!-- Biography -->
        <div class="max-w-6xl mx-auto bg-white/5 backdrop-blur-lg border border-white/10 p-8 rounded-2xl shadow-2xl mb-12">
            <h2 class="text-2xl font-bold mb-4 text-purple-300">About the Author</h2>
            <p th:text="${author.bio}" class="text-purple-200 leading-relaxed whitespace-pre-line"></p>
        </div>

        <!-- Books Section -->
        <div class="max-w-6xl mx-auto">

            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-white">
                    All Books by <span th:text="${author.name}" class="text-purple-300"></span>
                </h2>
                <span class="text-sm text-purple-200" th:text="${author.booksList.size() + ' Books'}"></span>
            </div>

            <!-- Books Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

                <div th:each="book : ${books}"
                     class="bg-white/5 backdrop-blur-lg border border-white/10 rounded-xl shadow-xl hover:bg-white/10 transition overflow-hidden">

                    <!-- Book Image -->
                    <div class="relative">
                        <img th:src="@{'/Images/Books/' + ${book.image}}"
                             class="w-full h-64 object-cover">
                    </div>

                    <!-- Book Content -->
                    <div class="p-5 space-y-4">

                        <h3 th:text="${book.title}" class="text-lg font-semibold text-white"></h3>

                        <p th:text="${book.description}" class="text-sm text-purple-200/80 line-clamp-3"></p>

                        <div class="flex items-center text-sm text-purple-200">
                            ⏱ <span class="ml-2" th:text="${book.duration}"></span>
                        </div>

                        <!-- Play Button -->
                        <a th:href="@{/audiobooks/{id}/play(id=${book.id})}"
                           class="block w-full text-center bg-gradient-to-r from-purple-600 to-blue-600 px-4 py-3 rounded-xl font-semibold hover:from-purple-700 hover:to-blue-700 transition">
                            <span th:if="${progressMap != null and progressMap.containsKey(book.id) and progressMap.get(book.id).currentTime > 0}">
                                Continue Listening
                            </span>
                            <span th:unless="${progressMap != null and progressMap.containsKey(book.id) and progressMap.get(book.id).currentTime > 0}">
                                Start Listening
                            </span>
                        </a>

                    </div>
                </div>

            </div>
        </div>

    </div>
</div>

<!-- Footer -->
<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
