<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Profile - AUDORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-indigo-100 to-blue-100 min-h-screen font-sans">

<!-- Navbar -->
<nav class="bg-white shadow-lg">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <h1 class="text-2xl font-extrabold text-indigo-600">📘 AUDORA</h1>
        <div class="space-x-6 flex items-center">
            <a href="#" class="text-gray-700 hover:text-indigo-600 transition">Home</a>
            <a href="#" class="text-gray-700 hover:text-indigo-600 transition">My Library</a>

            <!-- User Profile Dropdown -->
            <div class="relative">
                <!-- Profile Picture -->
                <img th:src="@{'/Images/profilepicture/'+ ${users.profilePicture}}" alt="Profile Picture" class="w-10 h-10 rounded-full object-cover cursor-pointer hover:ring-2 hover:ring-indigo-600 transition"
                     id="profileDropdownButton">

                <!-- Dropdown Menu -->
                <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg opacity-0 invisible group-hover:opacity-100 group-hover:visible transition duration-300"
                     id="profileDropdownMenu">
                    <ul class="text-gray-700">
                        <li class="px-4 py-2 hover:bg-indigo-100"><a th:href="@{/user/profile}">Profile Settings</a></li>
                        <li class="px-4 py-2 hover:bg-indigo-100"><a href="#">Subscriptions</a></li>
                        <li class="px-4 py-2 hover:bg-indigo-100"><a href="/logout" class="text-red-500">Logout</a></li>
                        <li class="px-4 py-2 hover:bg-indigo-100"><a href="#">About</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Main container -->
<div class="flex min-h-screen">

    <!-- Sidebar -->
    <div class="w-64 bg-indigo-700 text-white flex flex-col py-6 px-8 shadow-lg">
        <div class="flex items-center space-x-3 mb-8">
            <img th:src="@{'/Images/profilepicture/'+ ${users.profilePicture}}" alt="Profile Picture" class="w-16 h-16 rounded-full object-cover">
            <div class="space-y-2">
                <h2 class="text-xl font-semibold">Welcome,</h2>
                <h3 th:text="${users.name}" class="text-lg font-bold"></h3>
            </div>
        </div>

        <nav class="flex flex-col space-y-4">
            <a href="/user/profile" class="text-white hover:text-indigo-200 transition duration-300">
                Profile
            </a>
            <a href="/user/subscription" class="text-white hover:text-indigo-200 transition duration-300">
                Subscription
            </a>
            <a href="/user/about" class="text-white hover:text-indigo-200 transition duration-300">
                About
            </a>
        </nav>
    </div>

    <!-- Profile Content -->
    <div class="flex-1 bg-white p-8 overflow-auto">
        <h1 class="text-3xl font-bold text-indigo-700 mb-6">Your Profile</h1>

        <!-- Profile Details Section -->
        <div class="bg-white p-6 rounded-lg shadow-md">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Profile Picture and Name -->
                <div class="flex items-center space-x-4">
                    <img th:src="@{'/Images/profilepicture/'+ ${users.profilePicture}}" alt="Profile Picture" class="w-32 h-32 rounded-full object-cover">
                    <div>
                        <h2 th:text="${users.name}" class="text-2xl font-semibold"></h2>
                        <p th:text="${users.email}" class="text-gray-600"></p>
                    </div>
                </div>

                <!-- Edit Profile Button -->
                <div class="flex justify-end items-center">
                    <a href="/user/edit-profile" class="text-white bg-indigo-600 hover:bg-indigo-700 px-6 py-2 rounded-full">
                        Edit Profile
                    </a>
                </div>
            </div>

            <div class="mt-6 space-y-4">
                <!-- Email -->
                <div>
                    <h3 class="text-xl font-semibold text-gray-700">Email Address</h3>
                    <p th:text="${users.email}" class="text-lg text-gray-600"></p>
                </div>

                <!-- Phone Number -->
                <div>
                    <h3 class="text-xl font-semibold text-gray-700">Phone Number</h3>
                    <p class="text-lg text-gray-600">09876556783</p>
                </div>

                <!-- Subscription -->
                <div>
                    <h3 class="text-xl font-semibold text-gray-700">Subscription Plan</h3>
                    <p class="text-lg text-gray-600">Basic</p>
                </div>

                <!-- Membership Dates -->
                <div>
                    <h3 class="text-xl font-semibold text-gray-700">Membership</h3>
                    <p class="text-lg text-gray-600">Started: 2025/12/23 </p>
                    <p class="text-lg text-gray-600">Ends: 2027/12/13</p>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // JavaScript for handling the hover functionality for profile menu
    document.getElementById('profileDropdownButton').addEventListener('click', function () {
        const menu = document.getElementById('profileDropdownMenu');
        menu.classList.toggle('opacity-100');
        menu.classList.toggle('invisible');
    });
</script>

</body>
</html>
