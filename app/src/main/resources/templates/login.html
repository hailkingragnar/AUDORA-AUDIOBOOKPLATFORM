<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AUDORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(to right, #667eea, #764ba2);
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen px-4 py-8">
<div class="bg-white/30 backdrop-blur-md p-8 rounded-3xl shadow-2xl w-full max-w-md text-gray-800">
    <h2 class="text-3xl font-bold text-center mb-6">AUDORA Login</h2>

    <form th:action="@{api/v1/authenticate}" th:object="${userlogin}" method="POST" class="space-y-5">
        <div>
            <label  class="block mb-1 text-sm font-semibold">Email</label>
            <input
                    type="email"
                    th:field="*{userEmail}"
                    placeholder="you@example.com"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200"
            />
        </div>

        <div>
            <label  class="block mb-1 text-sm font-semibold">Password</label>
            <input
                    type="password"
                    th:field="*{userPassword}"
                    placeholder="••••••••"
                    required
                    class="w-full px-4 py-3 rounded-xl border border-gray-300 focus:outline-none focus:ring-2 focus:ring-blue-500 transition duration-200"
            />
        </div>

        <button
                type="submit"
                class="w-full py-3 bg-blue-600 text-white font-semibold rounded-xl hover:bg-blue-700 transition duration-200"
        >
            Login
        </button>
    </form>

    <p class="text-center text-sm mt-6 text-white">
        Don’t have an account?
        <a href="/register" class="text-blue-100 hover:underline">Register now</a>
    </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    let success = [[${success != null}]];
    let error = [[${error != null}]];

    if (success) {
        Swal.fire({
            icon: 'success',
            title: 'Success',
            text: [[${success}]],
            timer: 3000,
            showConfirmButton: false
        });
    }

    if (error) {
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: [[${error}]],
            timer: 3000,
            showConfirmButton: false
        });
    }
    /*]]>*/
</script>


</body>
</html>
