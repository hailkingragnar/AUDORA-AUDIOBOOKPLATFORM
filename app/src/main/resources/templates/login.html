<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - AUDORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0a;
        }

        /* Glass effect matching home page */
        .glass {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Enhanced card for login form */
        .enhanced-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .enhanced-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        /* Gradient text matching home page */
        .gradient-text {
            background: linear-gradient(45deg, #a855f7, #3b82f6, #06b6d4);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% 200%;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* Button styling matching home page */
        .sparkle {
            position: relative;
            overflow: hidden;
        }

        .sparkle::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            animation: sparkle 3s infinite;
        }

        @keyframes sparkle {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        /* Input styling */
        .input-enhanced {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-enhanced:focus {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(168, 85, 247, 0.5);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
        }

        .input-enhanced:hover {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        /* Floating animation */
        .floating {
            animation: floating 6s ease-in-out infinite;
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        /* Reveal animation */
        .reveal {
            opacity: 0;
            transform: translateY(30px);
            animation: reveal 0.8s ease forwards;
        }

        @keyframes reveal {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Icon bounce */
        .icon-bounce {
            animation: iconBounce 2s infinite;
        }

        @keyframes iconBounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-10px); }
            60% { transform: translateY(-5px); }
        }
    </style>

</head>

<!-- <th:block th:replace="~{fragments/navbarloginsignup :: navbarLogin}"></th:block>  -->


<!-- Add this style to your login/register page to account for fixed navbar -->
<style>
    body {
        padding-top: 68px; /* Adjust this value based on your navbar height */
    }

    @media (max-width: 768px) {
        body {
            padding-top: 60px; /* Smaller padding for mobile */
        }
    }
</style>

<body class="min-h-screen flex items-center justify-center px-4 py-8 relative">


<!-- Background decorative elements -->
<div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-20 text-6xl opacity-10 floating">🎧</div>
    <div class="absolute top-32 right-32 text-4xl opacity-5 floating" style="animation-delay: 1s;">📚</div>
    <div class="absolute bottom-32 left-32 text-5xl opacity-10 floating" style="animation-delay: 2s;">✨</div>
    <div class="absolute bottom-20 right-20 text-3xl opacity-5 floating" style="animation-delay: 1.5s;">🎵</div>
</div>

<div class="enhanced-card rounded-2xl w-full max-w-md p-8 shadow-2xl reveal">
    <!-- Logo and Title -->





    <div class="text-center mb-4 flex flex-col items-center"> <!-- Added flex container -->
        <a th:href="@{'/'}" class="inline-block"> <!-- Added inline-block -->
            <img th:src="@{'/Images/AudoraLogoNew.png'}"
                 alt="Audora Logo"
                 class="h-12 w-12 mx-auto object-contain mb-2 icon-bounce"> <!-- Removed mr-2, added mx-auto -->

        </a>

        <div th:if="${session.error}" class="alert alert-warning">
            <span th:text="${session.error}"></span>
            <a href="#" onclick="sessionStorage.removeItem('error')" class="close">×</a>
        </div>

        <h2 class="text-lg font-bold gradient-text mb-1 floating">AUDORA</h2>
        <p class="text-gray-400 text-sm font-light">Welcome back to your audio journey</p>
    </div>

    <form th:action="@{api/v1/authenticate}" th:object="${userlogin}" method="POST" class="space-y-6">
        <div>
            <label class="block mb-3 text-sm font-semibold text-white flex items-center space-x-2">
                <span>📧</span>
                <span>Email Address</span>
            </label>
            <input
                    type="email"
                    th:field="*{userEmail}"
                    placeholder="you@example.com"
                    required
                    class="w-full px-4 py-3 rounded-xl input-enhanced focus:outline-none text-white placeholder-gray-400"
            />
        </div>

        <div>
            <label class="block mb-3 text-sm font-semibold text-white flex items-center space-x-2">
                <span>🔒</span>
                <span>Password</span>
            </label>
            <input
                    type="password"
                    th:field="*{userPassword}"
                    placeholder="••••••••"
                    required
                    class="w-full px-4 py-3 rounded-xl input-enhanced focus:outline-none text-white placeholder-gray-400"
            />
        </div>

        <button
                type="submit"
                class="w-full py-3 bg-gradient-to-r from-purple-600 to-blue-600 text-white font-bold rounded-xl hover:from-purple-700 hover:to-blue-700 transition-all duration-300 transform hover:scale-105 shadow-lg hover:shadow-xl sparkle"
        >
            <span class="flex items-center justify-center space-x-2">
                <span>🚀</span>
                <span>Sign In to AUDORA</span>
            </span>
        </button>
    </form>

    <!-- Divider -->
    <div class="flex items-center my-6">
        <div class="flex-1 h-px bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
        <span class="px-4 text-sm text-gray-400">or</span>
        <div class="flex-1 h-px bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
    </div>

    <!-- OAUTH2 -->

    <!-- Google Sign-In Button -->
    <button
            onclick="window.location.href='/oauth2/authorization/google'"
            class="flex items-center justify-center w-full px-4 py-3 space-x-2 bg-white border border-gray-300 rounded-lg shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors duration-200"
    >
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
            <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
            <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
            <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
            <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span class="text-sm font-medium text-gray-700">Continue with Google</span>
    </button>

    <!-- Divider -->
    <div class="flex items-center my-6">
        <div class="flex-1 h-px bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
        <span class="px-4 text-sm text-gray-400">or</span>
        <div class="flex-1 h-px bg-gradient-to-r from-transparent via-white/20 to-transparent"></div>
    </div>

    <!-- Register Link -->
    <p class="text-center text-sm text-gray-400">
        New to our audio world?
        <a href="/register" class="text-yellow-400 hover:text-yellow-300 transition-colors duration-300 font-semibold hover:underline ml-1">
            ✨ Create Account
        </a>
    </p>



</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script th:inline="javascript">
    /*<![CDATA[*/
    let success = [[${success != null}]];
    let error = [[${error != null}]];

    if (success) {
        Swal.fire({
            icon: 'success',
            title: 'Success',
            text: [[${success}]],
            timer: 3000,
            showConfirmButton: false,
            background: 'rgba(0, 0, 0, 0.9)',
            backdrop: 'rgba(0, 0, 0, 0.4)',
            color: '#fff',
            customClass: {
                popup: 'backdrop-blur-lg border border-white/10'
            }
        });
    }

    if (error) {
        Swal.fire({
            icon: 'error',
            title: 'Error',
            text: [[${error}]],
            timer: 3000,
            showConfirmButton: false,
            background: 'rgba(0, 0, 0, 0.9)',
            backdrop: 'rgba(0, 0, 0, 0.4)',
            color: '#fff',
            customClass: {
                popup: 'backdrop-blur-lg border border-white/10'
            }
        });
    }
    /*]]>*/
</script>

</body>
</html>
