<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Home')}"></head>
<body>

<th:block th:replace="~{fragments/navbarloginsignup :: navbarLogin}"></th:block>

<!-- Popular Audiobooks Section -->
<section class="pt-28 pb-4  reveal" id="popular-books">
    <div class="mb-4 px-4">
        <h3 class="text-lg font-bold text-white mb-4 icon-bounce drop-shadow-lg section-highlight">📚 Popular Audiobooks</h3>
    </div>

    <div class="relative">
        <!-- Scrollable container for Popular Books -->
        <div class="scroll-section flex overflow-x-auto pb-4 hide-scrollbar scroll-smooth space-x-4 px-4">
            <div th:each="book : ${books}" class="reveal flex-shrink-0 w-44 enhanced-card rounded-xl overflow-hidden shadow-lg card-hover sparkle">
                <a th:href="@{'/user/viewbook/' + ${book.audiobookId}}">
                    <img th:src="@{'/Images/Books/' + ${book.image}}" alt="Book Cover" class="w-full h-40 object-cover hover:scale-105 transition-transform duration-300">
                </a>
            </div>
        </div>
    </div>
</section>


<!-- Authors Section -->
<section class="py-8 reveal">
    <div class="mb-4 px-4">
        <h3 class="text-lg font-bold text-white mb-4 icon-bounce drop-shadow-lg section-highlight">✍️ Popular Authors</h3>
    </div>

    <div class="relative">
        <!-- Scrollable container for Authors -->
        <div class="scroll-section flex overflow-x-auto pb-4 hide-scrollbar scroll-smooth px-4">
            <div th:each="author : ${authors}"
                 class="flex flex-col items-center flex-shrink-0 w-40 mx-2">  <!-- mx-3 for horizontal margin -->
                <a th:href="@{'/user/author/' + ${author.id}}" class="group block">
                    <div class="rounded-full overflow-hidden w-40 h-40 border-2 border-indigo-400
                       group-hover:border-indigo-300 transition-all duration-300 shadow-lg
                       mx-auto">  <!-- mx-auto centers the circle -->
                        <img th:src="@{'/Images/Authors/' + ${author.image}}"
                             alt="Author Image"
                             class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-300">
                    </div>
                    <p class="mt-3 text-white text-center text-sm font-medium
                     group-hover:text-indigo-300 transition-colors duration-300"
                       th:text="${author.penName}"></p>
                </a>
            </div>
        </div>
    </div>
</section>


<!-- Category Sections -->
<section th:each="category : ${categories}" class=" mb-4 reveal">
    <div class="mb-4 px-4">
        <h3 class="text-lg font-bold text-white mb-2 drop-shadow-lg section-highlight" th:text="'📚 ' + ${category.categoryName}"></h3>
    </div>

    <div class="relative">
        <!-- Scrollable container for Category Books -->
        <div class="scroll-section flex overflow-x-auto pb-4 hide-scrollbar scroll-smooth space-x-4 px-4">
            <div th:each="book : ${category.books}" class="reveal flex-shrink-0 w-44 enhanced-card rounded-xl overflow-hidden shadow-lg card-hover sparkle">
                <a th:href="@{'/user/viewbook/' + ${book.audiobookId}}">
                    <img th:src="@{'/Images/Books/' + ${book.image}}" alt="Book Cover" class="w-full h-40 object-cover hover:scale-105 transition-transform duration-300">
                </a>
            </div>
        </div>
    </div>
</section>

<th:block th:replace="~{fragments/footer :: footer}"></th:block>
<th:block th:replace="~{fragments/scripts :: scripts}"></th:block>

</body>
</html>
