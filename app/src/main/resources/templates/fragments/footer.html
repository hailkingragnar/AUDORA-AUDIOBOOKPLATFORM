<footer th:fragment="footer"
        class="bg-gradient-to-b from-[#0f172a] via-[#1e293b] to-[#0f172a] py-28 text-white">
    <!-- Add this to your footer fragment (fragments/footer.html) or main layout -->

    <!-- Bottom Persistent Player HTML (Include on ALL pages) -->
    <div id="bottomPlayer" class="fixed bottom-0 left-0 right-0 bg-gradient-to-r from-gray-900 via-gray-800 to-gray-900 border-t border-white/10 shadow-2xl z-50 backdrop-blur-xl transform translate-y-full transition-transform duration-300">

        <!-- Progress Bar -->
        <div id="bottomProgressContainer" class="h-1 bg-white/10 cursor-pointer hover:h-2 transition-all">
            <div id="bottomProgressBar" class="h-full bg-gradient-to-r from-purple-600 to-blue-600 w-0"></div>
        </div>

        <div class="flex items-center justify-between px-4 py-3">

            <!-- Left: Book Info -->
            <div class="flex items-center gap-3 flex-1 min-w-0">
                <img id="bottomBookCover" src="" alt="Book Cover" class="w-12 h-12 rounded-lg object-cover shadow-lg">
                <div class="min-w-0 flex-1">
                    <h3 id="bottomChapterTitle" class="text-white font-semibold text-sm truncate">Chapter Title</h3>
                    <p id="bottomBookTitle" class="text-gray-400 text-xs truncate">Book Title</p>
                </div>
            </div>

            <!-- Center: Controls -->
            <div class="flex items-center gap-4 mx-6">
                <button id="bottomRewindBtn" class="text-white hover:text-purple-400 transition">
                    <i class="fas fa-backward"></i>
                </button>

                <button id="bottomPlayBtn" class="w-10 h-10 bg-gradient-to-r from-purple-600 to-blue-600 text-white rounded-full flex items-center justify-center hover:scale-110 transition shadow-lg">
                    <i class="fas fa-play"></i>
                </button>

                <button id="bottomForwardBtn" class="text-white hover:text-purple-400 transition">
                    <i class="fas fa-forward"></i>
                </button>
            </div>

            <!-- Right: Additional Controls -->
            <div class="flex items-center gap-4 flex-1 justify-end">
                <!-- Time -->
                <div class="text-xs text-gray-400 hidden md:flex items-center gap-1">
                    <span id="bottomCurrentTime">0:00</span>
                    <span>/</span>
                    <span id="bottomTotalTime">0:00</span>
                </div>

                <!-- Volume -->
                <div class="relative hidden md:block">
                    <button id="bottomVolumeBtn" class="text-white hover:text-purple-400 transition">
                        <i class="fas fa-volume-up" id="bottomVolumeIcon"></i>
                    </button>

                    <div id="bottomVolumeSliderContainer" class="hidden absolute bottom-full mb-2 right-0 bg-gray-800 rounded-xl shadow-2xl border border-white/10 p-3">
                        <input type="range" id="bottomVolumeSlider" min="0" max="100" value="100" class="w-24 h-2 bg-white/10 rounded appearance-none cursor-pointer">
                    </div>
                </div>

                <!-- Settings -->
                <div class="relative hidden md:block">
                    <button id="bottomSettingsBtn" class="text-white hover:text-purple-400 transition">
                        <i class="fas fa-cog"></i>
                    </button>

                    <div id="bottomSettingsMenu" class="hidden absolute bottom-full mb-2 right-0 bg-gray-800 rounded-xl shadow-2xl border border-white/10 p-4 w-48">
                        <h3 class="text-xs font-semibold mb-2 text-gray-300">Speed</h3>
                        <div class="flex flex-wrap gap-2">
                            <button class="bottom-speed-btn px-2 py-1 rounded bg-white/5 hover:bg-purple-600 transition text-xs" data-speed="0.75">0.75x</button>
                            <button class="bottom-speed-btn px-2 py-1 rounded bg-purple-600 transition text-xs" data-speed="1">1x</button>
                            <button class="bottom-speed-btn px-2 py-1 rounded bg-white/5 hover:bg-purple-600 transition text-xs" data-speed="1.25">1.25x</button>
                            <button class="bottom-speed-btn px-2 py-1 rounded bg-white/5 hover:bg-purple-600 transition text-xs" data-speed="1.5">1.5x</button>
                            <button class="bottom-speed-btn px-2 py-1 rounded bg-white/5 hover:bg-purple-600 transition text-xs" data-speed="2">2x</button>
                        </div>
                    </div>
                </div>

                <!-- Expand -->
                <button id="expandPlayerBtn" class="text-white hover:text-purple-400 transition hidden md:block" title="Go to chapter page">
                    <i class="fas fa-expand"></i>
                </button>

                <!-- Close -->
                <button id="closePlayerBtn" class="text-white hover:text-red-400 transition" title="Stop playback">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        </div>
    </div>

    <style>
        #bottomVolumeSlider::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: #a855f7;
            cursor: pointer;
            border-radius: 50%;
        }

        #bottomVolumeSlider::-moz-range-thumb {
            width: 12px;
            height: 12px;
            background: #a855f7;
            cursor: pointer;
            border-radius: 50%;
            border: none;
        }
    </style>


<div class="container mx-auto px-6">
        <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
            <div>
                <h3 class="text-xl font-bold text-primary mb-4">Audora</h3>
                <p class="text-gray-400">Your premium audio experience. High quality sounds for everyone.</p>
            </div>
            <div>
                <h4 class="font-bold mb-4">Company</h4>
                <ul class="space-y-2">
                    <li><a href="#" class="text-gray-400 hover:text-primary transition">About</a></li>
                    <li><a href="#" class="text-gray-400 hover:text-primary transition">Careers</a></li>
                    <li><a href="#" class="text-gray-400 hover:text-primary transition">Blog</a></li>
                </ul>
            </div>
            <div>
                <h4 class="font-bold mb-4">Support</h4>
                <ul class="space-y-2">
                    <li><a href="#" class="text-gray-400 hover:text-primary transition">Help Center</a></li>
                    <li><a href="#" class="text-gray-400 hover:text-primary transition">Contact Us</a></li>
                    <li><a href="#" class="text-gray-400 hover:text-primary transition">Privacy Policy</a></li>
                </ul>
            </div>
            <div>
                <h4 class="font-bold mb-4">Connect</h4>
                <div class="flex space-x-4">
                    <a href="#" class="text-gray-400 hover:text-primary transition"><i class="fab fa-twitter"></i></a>
                    <a href="#" class="text-gray-400 hover:text-primary transition"><i class="fab fa-facebook"></i></a>
                    <a href="#" class="text-gray-400 hover:text-primary transition"><i class="fab fa-instagram"></i></a>
                    <a href="#" class="text-gray-400 hover:text-primary transition"><i class="fab fa-linkedin"></i></a>
                </div>
            </div>
        </div>
        <div class="border-t border-gray-800 mt-8 pt-8 text-center text-gray-500">
            <p>© 2023 Audora. All rights reserved.</p>
        </div>
    </div>
    <!-- Global Player Script -->
    <script>
        (function() {
            'use strict';

            // Check if we're on the chapter page
            const isChapterPage = window.location.pathname.indexOf('/viewchapter/') !== -1;

            // Only run this on non-chapter pages
            if (isChapterPage) return;

            const savedChapterId = localStorage.getItem('currentChapterId');
            const savedBookImage = localStorage.getItem('bookImage');
            const savedChapterTitle = localStorage.getItem('chapterTitle');
            const savedBookTitle = localStorage.getItem('bookTitle');

            const bottomPlayer = document.getElementById('bottomPlayer');

            if (savedChapterId && savedBookImage && bottomPlayer) {
                // Update player info
                document.getElementById('bottomBookCover').src = `/Images/Books/${savedBookImage}`;
                document.getElementById('bottomChapterTitle').textContent = savedChapterTitle || 'Chapter';
                document.getElementById('bottomBookTitle').textContent = savedBookTitle || 'Book';

                // Show player
                bottomPlayer.classList.remove('translate-y-full');
                bottomPlayer.classList.add('translate-y-0');

                // Expand button - go to chapter page
                const expandBtn = document.getElementById('expandPlayerBtn');
                if (expandBtn) {
                    expandBtn.onclick = () => {
                        window.location.href = `/book/viewchapter/${savedChapterId}`;
                    };
                }

                // Play button - go to chapter page and auto-play
                const playBtn = document.getElementById('bottomPlayBtn');
                if (playBtn) {
                    playBtn.onclick = () => {
                        localStorage.setItem('isPlaying', 'true');
                        window.location.href = `/book/viewchapter/${savedChapterId}`;
                    };
                }

                // Close button - clear everything
                const closeBtn = document.getElementById('closePlayerBtn');
                if (closeBtn) {
                    closeBtn.onclick = () => {
                        bottomPlayer.classList.add('translate-y-full');
                        bottomPlayer.classList.remove('translate-y-0');
                        localStorage.removeItem('currentChapterId');
                        localStorage.removeItem('isPlaying');
                        localStorage.removeItem('currentTime');
                        localStorage.removeItem('bookImage');
                        localStorage.removeItem('chapterTitle');
                        localStorage.removeItem('bookTitle');
                    };
                }

                // Other controls disabled on non-chapter pages (show message)
                const disabledControls = [
                    document.getElementById('bottomRewindBtn'),
                    document.getElementById('bottomForwardBtn')
                ];

                disabledControls.forEach(ctrl => {
                    if (ctrl) {
                        ctrl.onclick = () => {
                            alert('Please go to the chapter page to use controls');
                            window.location.href = `/book/viewchapter/${savedChapterId}`;
                        };
                    }
                });
            }
        })();
    </script>
</footer>
