<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUDORA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
          darkMode: 'class',
          theme: {
            extend: {
              colors: {
                primary: {
                  50: '#f0f9ff',
                  500: '#3b82f6',
                  600: '#2563eb',
                  700: '#1d4ed8'
                }
              }
            }
          }
        }
    </script>

</head>

<body class="bg-gradient-to-br from-blue-50 to-purple-50 dark:bg-gradient-to-br dark:from-gray-900 dark:to-gray-800 min-h-screen">
<!-- Navbar Fragment -->
<nav th:fragment="navbar" class="glass dark:bg-gray-800/80 fixed w-full top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
        <a th:href="@{/}" class="text-2xl font-extrabold text-blue-600 dark:text-purple-400 flex items-center">
            <span class="mr-2">📘</span> AUDORA
        </a>

        <div class="flex items-center space-x-6">
            <button id="theme-toggle" class="p-2 rounded-full focus:outline-none">
                <i class="fas fa-sun text-yellow-400 dark:text-gray-300"></i>
                <i class="fas fa-moon text-gray-600 dark:text-yellow-300 hidden"></i>
            </button>

            <div class="relative">
                <img th:src="@{'/Images/profilepicture/'+ ${users.profilePicture}}" alt="Profile"
                     class="w-10 h-10 rounded-full cursor-pointer ring-2 ring-blue-400 dark:ring-purple-500">
                <div class="absolute right-0 mt-2 w-48 bg-white dark:bg-gray-800 rounded-lg shadow-lg py-2 z-50 hidden" id="profile-menu">
                    <a th:href="@{/user/profile}" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-blue-50 dark:hover:bg-gray-700">Profile</a>
                    <a href="#" class="block px-4 py-2 text-gray-800 dark:text-gray-200 hover:bg-blue-50 dark:hover:bg-gray-700">Library</a>
                    <a href="/logout" class="block px-4 py-2 text-red-500 hover:bg-blue-50 dark:hover:bg-gray-700">Logout</a>
                </div>
            </div>
        </div>
    </div>
</nav>

<!-- Footer Fragment -->
<footer th:fragment="footer" class="bg-white dark:bg-gray-800 py-8 mt-16">
    <div class="max-w-7xl mx-auto px-6 text-center">
        <div class="flex justify-center items-center space-x-4 mb-4">
            <span class="text-2xl">🎵</span>
            <span class="font-semibold text-gray-800 dark:text-gray-200">&copy; 2025 AUDORA. All rights reserved.</span>
            <span class="text-2xl">📖</span>
        </div>
        <p class="text-sm text-gray-600 dark:text-gray-400">Made with ❤️ for audiobook lovers</p>
    </div>
</footer>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
