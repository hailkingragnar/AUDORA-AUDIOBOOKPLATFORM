<style>
    /* Custom Scrollbar */
    .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
    }

    .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(168, 85, 247, 0.5);
        border-radius: 10px;
    }

    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(168, 85, 247, 0.7);
    }

    /* Dropdown Animation */
    #profileDropdownMenu.show,
    #categoriesDropdown.show {
        opacity: 1 !important;
        visibility: visible !important;
        transform: scale(1) !important;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Profile Dropdown
        const profileButton = document.getElementById('profileDropdownButton');
        const profileMenu = document.getElementById('profileDropdownMenu');

        if (profileButton && profileMenu) {
            profileButton.addEventListener('click', function(e) {
                e.stopPropagation();
                profileMenu.classList.toggle('show');
            });
        }

        // Categories Dropdown
        const categoriesButton = document.getElementById('categoriesDropdownButton');
        const categoriesDropdown = document.getElementById('categoriesDropdown');

        if (categoriesButton && categoriesDropdown) {
            categoriesButton.addEventListener('click', function(e) {
                e.stopPropagation();
                categoriesDropdown.classList.toggle('hidden');
            });
        }

        // Mobile Menu
        const mobileMenuButton = document.getElementById('mobileMenuButton');
        const mobileMenu = document.getElementById('mobileMenu');

        if (mobileMenuButton && mobileMenu) {
            mobileMenuButton.addEventListener('click', function() {
                mobileMenu.classList.toggle('hidden');
            });
        }

        // Close dropdowns when clicking outside
        document.addEventListener('click', function(e) {
            if (profileMenu && !profileButton.contains(e.target) && !profileMenu.contains(e.target)) {
                profileMenu.classList.remove('show');
            }
            if (categoriesDropdown && !categoriesButton.contains(e.target) && !categoriesDropdown.contains(e.target)) {
                categoriesDropdown.classList.add('hidden');
            }
        });
    });
</script>
