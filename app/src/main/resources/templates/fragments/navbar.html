<nav th:fragment="navbar" class="fixed w-full top-0 z-50 bg-[#0f172a] shadow-md">
    <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center" th:object="${users}">

        <!-- Logo -->
        <a th:href="@{/user/home}" class="flex items-center space-x-2">
            <img th:src="@{'/Images/AudoraLogoNew.png'}" alt="Audora Logo" class="h-12 w-12 object-contain">
            <h1 class="text-xl font-extrabold text-white">AUDORA</h1>
        </a>

        <!-- Search Bar -->
        <div class="hidden md:flex flex-1 max-w-md mx-6 relative">
            <input type="text"
                   id="searchInput"
                   placeholder="Search audiobooks..."
                   class="w-full py-2 px-4 rounded-full bg-gray-700 text-white placeholder-gray-300 focus:outline-none focus:ring-2 focus:ring-purple-500"
                   autocomplete="off">
            <button class="absolute right-3 top-2 text-gray-300 hover:text-white transition">🔍</button>
            <div id="autocompleteResults" class="hidden absolute z-50 w-full mt-1 bg-gray-800 rounded-lg shadow-lg max-h-80 overflow-y-auto"></div>
        </div>

        <!-- Navigation Links -->
        <div class="flex items-center space-x-6">

            <a th:href="@{/user/home}" class="text-white font-medium hover:text-yellow-300 transition transform hover:scale-105">Home</a>
            <a th:href="@{/user/library}" class="text-white font-medium hover:text-yellow-300 transition transform hover:scale-105">My Library</a>

            <!-- Categories Dropdown -->
            <div class="relative">
                <button id="categoriesDropdownButton" class="flex items-center text-white hover:text-yellow-300 transition px-3 py-2 rounded-lg bg-gray-700 hover:bg-gray-600">
                    Categories <span class="ml-1">▼</span>
                </button>
                <div id="categoriesDropdown" class="absolute left-0 mt-2 w-64 bg-[#363636] rounded-lg shadow-lg hidden border border-gray-600">
                    <div class="p-4">
                        <h3 class="text-lg font-bold text-white mb-2">Browse by Category</h3>
                        <div class="grid grid-cols-2 gap-2" th:each="category : ${categories}">
                            <a th:href="@{'/category/books/' + ${category.id}}" class="px-3 py-2 text-sm text-gray-300 hover:bg-gray-600 rounded transition">
                                <span th:text="${category.categoryName}"></span>
                            </a>
                        </div>
                        <a href="/categories" class="block mt-3 text-center text-purple-300 hover:text-purple-200 text-sm">View all categories →</a>
                    </div>
                </div>
            </div>

            <!-- User Profile Dropdown -->
            <div class="relative">
                <button id="profileDropdownButton" class="focus:outline-none">
                    <img th:if="${users.profilePicture != null}"
                         th:src="@{'/Images/profilepicture/' + ${users.profilePicture}}"
                         alt="Profile Picture"
                         class="w-10 h-10 rounded-full object-cover hover:ring-2 hover:ring-purple-400 transition duration-300">
                    <i th:if="${users.profilePicture == null}"
                       class="fas fa-user text-gray-500 text-xl bg-purple-100 rounded-full p-2 ring-1 ring-purple-400 hover:ring-4 transition duration-300"></i>
                </button>
                <div id="profileDropdownMenu" class="absolute right-0 mt-3 w-52 bg-[#363636] rounded-2xl shadow-2xl opacity-0 invisible transition-all duration-300 transform scale-95">
                    <ul class="text-white py-2">
                        <li class="px-6 py-3 hover:bg-gradient-to-r hover:from-purple-100/20 hover:to-blue-100/20 rounded-xl mx-2">
                            <a th:href="@{/user/profile}" class="flex items-center space-x-2">👤 Profile Settings</a>
                        </li>
                        <li class="px-6 py-3 hover:bg-gradient-to-r hover:from-purple-100/20 hover:to-blue-100/20 rounded-xl mx-2">
                            <a th:if="${not isAdmin}" th:href="@{/user/subscription}" class="flex items-center space-x-2">⭐ Subscriptions</a>
                            <a th:if="${isAdmin}" href="/admin/home" class="flex items-center space-x-2">💻 Admin Dashboard</a>
                        </li>
                        <li class="px-6 py-3 hover:bg-gradient-to-r hover:from-red-100/20 hover:to-pink-100/20 rounded-xl mx-2">
                            <a href="/logout" class="text-red-300 flex items-center space-x-2">🚪 Logout</a>
                        </li>
                        <li class="px-6 py-3 hover:bg-gradient-to-r hover:from-purple-100/20 hover:to-blue-100/20 rounded-xl mx-2">
                            <a href="#" class="flex items-center space-x-2">ℹ️ About</a>
                        </li>
                    </ul>
                </div>
            </div>

        </div>
    </div>
</nav>
