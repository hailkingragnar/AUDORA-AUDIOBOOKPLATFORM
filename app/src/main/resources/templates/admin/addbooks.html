<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" class="dark">
<head th:replace="~{admin/home :: head('Add Book')}"></head>

<body class="bg-gray-900 text-gray-100 min-h-screen">

<th:block th:replace="~{admin/home :: adminNavbar}"></th:block>

<div class="max-w-4xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
  <!-- Form Card -->
  <div class="bg-gray-800 rounded-xl shadow-xl overflow-hidden border border-gray-700">
    <!-- Form Header -->
    <div class="px-8 py-6 bg-gray-900 border-b border-gray-700">

      <p class="text-gray-400 mt-1">Complete all required fields</p>
    </div>

    <!-- Main Form -->
    <form th:action="@{/admin/addbook}" th:object="${book}" method="post" enctype="multipart/form-data" class="p-8">
      <!-- Basic Information Section -->
      <div class="mb-10">
        <h3 class="text-lg font-medium text-indigo-300 mb-4 pb-2 border-b border-gray-700">
          <i class="fas fa-info-circle mr-2"></i>Basic Information
        </h3>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Title -->
          <div class="lg:col-span-2">
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Title <span class="text-red-500">*</span>
            </label>
            <input type="text" th:field="*{title}" required
                   class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-4 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="Enter audiobook title">
            <span class="text-red-400 text-sm" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
          </div>

          <!-- Author -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Author <span class="text-red-500">*</span>
            </label>
            <input type="text" th:field="*{author}" required
                   class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-4 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="Enter author name">
          </div>

          <!-- Narrator -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Narrator
            </label>
            <input type="text" th:field="*{narrator}"
                   class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-4 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="Enter narrator name">
          </div>

          <!-- Duration -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Duration
            </label>
            <input type="text" th:field="*{duration}"
                   class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-4 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="e.g., 8 hours 30 minutes">
          </div>

          <!-- Language -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Language
            </label>
            <select th:field="*{language}"
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-4 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              <option value="">Select language</option>
              <option value="English">English</option>
              <option value="Spanish">Spanish</option>
              <option value="French">French</option>
              <option value="German">German</option>
              <option value="Italian">Italian</option>
              <option value="Other">Other</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Content Details Section -->
      <div class="mb-10">
        <h3 class="text-lg font-medium text-indigo-300 mb-4 pb-2 border-b border-gray-700">
          <i class="fas fa-book-open mr-2"></i>Content Details
        </h3>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Genre -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Genre
            </label>
            <input type="text" th:field="*{genre}"
                   class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-4 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="e.g., Fiction, Mystery, Biography">
          </div>

          <!-- Categories -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Categories
            </label>
            <select multiple
                    th:field="*{categoryNames}"
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-4 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 h-32">
              <option th:each="category : ${categories}"
                      th:value="${category.categoryName}"
                      th:text="${category.categoryName}">
                Category Name
              </option>
            </select>
            <p class="text-xs text-gray-500 mt-1">Hold Ctrl/Cmd to select multiple categories</p>
          </div>

          <!-- Description -->
          <div class="lg:col-span-2">
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Description
            </label>
            <textarea th:field="*{description}"
                      rows="4"
                      class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-4 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 resize-vertical"
                      placeholder="Enter a detailed description of the audiobook..."></textarea>
          </div>
        </div>
      </div>

      <!-- Publication Details Section -->
      <div class="mb-10">
        <h3 class="text-lg font-medium text-indigo-300 mb-4 pb-2 border-b border-gray-700">
          <i class="fas fa-calendar-alt mr-2"></i>Publication Details
        </h3>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
          <!-- Release Date -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Release Date
            </label>
            <input type="date" th:field="*{releaseDate}"
                   class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-4 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
          </div>

          <!-- ISBN -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              ISBN
            </label>
            <input type="text" th:field="*{isbn}"
                   class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-4 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                   placeholder="Enter ISBN number">
          </div>

          <!-- File Format -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              File Format
            </label>
            <select th:field="*{fileFormat}"
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-4 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              <option value="">Select format</option>
              <option value="MP3">MP3</option>
              <option value="M4A">M4A</option>
              <option value="AAC">AAC</option>
              <option value="WAV">WAV</option>
              <option value="FLAC">FLAC</option>
            </select>
          </div>

          <!-- Price -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Price ($)
            </label>
            <div class="relative rounded-md shadow-sm">
              <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <span class="text-gray-400 sm:text-sm">$</span>
              </div>
              <input type="number"
                     th:field="*{price}"
                     step="0.01"
                     min="0"
                     class="block w-full pl-7 pr-12 py-2 bg-gray-700 border border-gray-600 rounded-lg text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500"
                     placeholder="0.00">
              <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none">
                <span class="text-gray-400 sm:text-sm">USD</span>
              </div>
            </div>
          </div>

          <!-- Availability -->
          <div>
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Availability
            </label>
            <select th:field="*{availability}"
                    class="w-full bg-gray-700 border border-gray-600 rounded-lg py-2 px-4 text-gray-100 placeholder-gray-400 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500">
              <option value="">Select availability</option>
              <option value="Available">Available</option>
              <option value="Out of Stock">Out of Stock</option>
              <option value="Pre-order">Pre-order</option>
              <option value="Coming Soon">Coming Soon</option>
            </select>
          </div>

          <!-- Cover Image -->
          <div class="space-y-2">
            <label class="block text-sm font-medium text-gray-300 mb-2">
              Cover Image <span class="text-red-500">*</span>
            </label>

            <!-- Upload Area -->
            <div id="bookUploadArea" class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-600 border-dashed rounded-lg bg-gray-700 hover:bg-gray-600 transition cursor-pointer">
              <div class="space-y-1 text-center">
                <div class="flex justify-center text-sm text-gray-400">
                  <label class="relative cursor-pointer rounded-md font-medium text-indigo-400 hover:text-indigo-300">
                    <span>Upload a file</span>
                    <input id="bookImageUpload" name="imageFile" type="file" class="sr-only" accept="image/jpeg, image/png, image/webp">
                  </label>
                  <p class="pl-1">or drag and drop</p>
                </div>
                <p class="text-xs text-gray-500">PNG, JPG, WEBP up to 5MB</p>
              </div>
            </div>

            <!-- Preview Area -->
            <div id="bookPreviewContainer" class="hidden mt-2">
              <div class="relative inline-block">
                <img id="bookImagePreview" class="h-64 w-48 rounded-lg object-cover border border-gray-600" src="" alt="Book cover preview">
                <button id="removeBookImage" type="button" class="absolute -top-2 -right-2 p-1 bg-red-500 text-white rounded-full hover:bg-red-600 focus:outline-none">
                  <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                  </svg>
                </button>
              </div>
              <p id="bookImageFilename" class="mt-1 text-xs text-gray-400 truncate"></p>
            </div>

            <!-- Error Message -->
            <p id="bookFileError" class="mt-1 text-sm text-red-400 hidden"></p>
          </div>
        </div>
      </div>

      <!-- Chapters Section -->
      <div class="mb-10">
        <h3 class="text-lg font-medium text-indigo-300 mb-4 pb-2 border-b border-gray-700">
          <i class="fas fa-list-ol mr-2"></i>Chapters
        </h3>

        <div id="chapters-container">
          <!-- Chapters will be added here dynamically -->
        </div>

        <button type="button" id="add-chapter" class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition-colors">
          <i class="fas fa-plus mr-2"></i>Add Chapter
        </button>
      </div>

      <!-- Form Actions -->
      <div class="flex justify-end space-x-4 pt-6 border-t border-gray-700">
        <a th:href="@{/admin/books}"
           class="bg-gray-700 hover:bg-gray-600 text-white px-6 py-2 rounded-lg transition flex items-center">
          <i class="fas fa-times mr-2"></i> Cancel
        </a>
        <button type="submit"
                class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2 rounded-lg transition flex items-center">
          <i class="fas fa-save mr-2"></i> Save Book
        </button>
      </div>
    </form>
  </div>
</div>

<th:block th:replace="~{admin/home :: adminFooter}"></th:block>
<script src="/js/adminScript.js"></script>

</body>
</html>
